# gVisor C/R warm-pool SIDECAR for titanarum on blastbox.host — a dedicated,
# socket-less warm dispatcher that runs titanarum's JVM/PDFBox worker inside
# disposable runsc sandboxes that are CHECKPOINTED at READY (after warmup()'s
# unbounded go-wait blocks -- titanarum/engine.py) and RESTORED per job.
#
#   docker compose -f docker-compose.yml -f docker-compose.gvisor.yml \
#     --project-name titanarum-bb up -d --force-recreate dispatcher-gvisor
#
# WHY this tier (vs a future FC sidecar): Firecracker needs /dev/kvm. Many cloud
# hosts -- nested-virt-disabled VMs, some AWS instance types, CI runners -- don't
# expose it. This tier pins gVisor's `systrap` platform (seccomp + signals; NEVER
# opens /dev/kvm), so it is the KVM-LESS warm path.
#
# Runs `runsc` checkpoint/restore directly, so it needs root-in-container + a
# scoped cap set + seccomp=unconfined (proven minimal on the RedTusk/clippyshot
# gVisor sidecars: runsc fails the gofer fork otherwise). That privilege is
# CONFINED here: this box holds NO docker socket, NO ports -- only the Postgres
# queue + the warm rootfs. The hardened cold dispatcher (docker-compose.yml) keeps
# cap_drop=ALL + read_only. BLASTBOX_DISPATCH_WARM_ONLY makes it claim-gate on free
# warm slots and never cold-fall-back, so overflow stays queued for the cold
# dispatcher.
#
# Prerequisite — the warm OCI rootfs on the host at ${TITANARUM_GVISOR_DIR}/rootfs
# (default /home/coz/titanarum-bb-gvisor/rootfs), a `docker export` of
# titanarum-warm:gvisor (built from deploy/gvisor/Dockerfile.titanarum FROM
# titanarum-cold-worker:${TAG}) -- the heavy rootfs bake is Task 10, NOT done by
# this file. Unlike a soffice/clippyshot gVisor rootfs there is NO accept-retry
# LD_PRELOAD shim -- titanarum's warm worker is FILE-IPC (the JVM polls
# control/control.go), not a listening socket's accept(), so there is no
# restore-EINTR accept() to retry (see deploy/gvisor/Dockerfile.titanarum's header
# for the full rationale).
services:
  dispatcher-gvisor:
    image: ${TITANARUM_IMAGE:-titanarum:pha2}
    # Clear stale runsc state + checkpoint on startup, THEN run the dispatch loop.
    # The C/R snapshot is rebuilt fresh each boot; a leftover checkpoint image makes
    # `runsc checkpoint` fail "file exists" (it won't overwrite), so the sidecar
    # couldn't survive a restart without this. (Image default command is the API
    # server.)
    command: ["sh", "-c", "rm -rf /var/lib/blastbox/gvisor-snapshot /var/lib/blastbox/gvisor-base-* /var/lib/blastbox/gvisor-root 2>/dev/null; mkdir -p /var/lib/blastbox/gvisor-root; exec blastbox dispatch"]
    restart: unless-stopped
    # Aggregate memory ceiling for the warm pool (the host memory cgroup
    # GvisorConfig defers to: it intentionally does NOT RLIMIT_AS the worker tree —
    # risks false VADDR kills — relying on the inner sandbox plus an operator
    # cgroup HERE). Titanarum's JVM is -Xmx4g per warm slot, so the pool-wide
    # ceiling must be sized for TITANARUM_GVISOR_WARM_SIZE concurrent slots, not a
    # single one — default 24g assumes a handful of slots with headroom (unlike
    # RedTusk's unbounded default, titanarum's plan pins a real ceiling here).
    mem_limit: ${TITANARUM_GVISOR_MEMORY:-24g}
    # Liveness is covered by restart: unless-stopped; the image default healthcheck
    # is the wrong probe for a warm-only, root-running dispatcher.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    user: "0:0"                       # runsc must be root inside the container to build the sandbox
    # runsc-in-docker needs docker's DEFAULT caps PLUS these three (proven minimal
    # on the RedTusk/clippyshot gVisor sidecars: dropping ALL + re-adding only a
    # subset leaves the gofer fork EPERM on a missing default cap). NOT
    # --privileged; still confined to this single-purpose, socket-less sidecar.
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined            # runsc uses syscalls the default profile blocks
      - apparmor=unconfined
    environment:
      - BLASTBOX_DATABASE_URL=postgresql://${POSTGRES_USER:-titanarum}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-titanarum}
      - BLASTBOX_JOB_ROOT=${TITANARUM_DATA_DIR:-/home/coz/titanarum-bb-data}/jobs
      - BLASTBOX_JOB_RETENTION_SECONDS=${BLASTBOX_JOB_RETENTION_SECONDS:-0}
      # Trust-gate cap — MUST match the cold dispatcher + api exactly.
      - BLASTBOX_MAX_METADATA=${BLASTBOX_MAX_METADATA:-104857600}
      # Engine registry + the three boundary keys + NETPOLICY — MUST be
      # byte-identical to the cold dispatcher (docker-compose.yml). Without this
      # mirroring, this warm tier would fall back to whatever its own defaults are
      # (default-deny param allowlist, no reserved-key denylist, no netpolicy),
      # which could let a client's job.params reach titanarum's code-exec-vector
      # TITANARUM_* knobs on this tier even though the cold tier blocks them.
      - BLASTBOX_ENGINES=titanarum=${TITANARUM_WORKER_IMAGE}
      - BLASTBOX_ENGINE_TITANARUM_PARAM_KEYS=${BLASTBOX_ENGINE_TITANARUM_PARAM_KEYS:-TITANARUM_SKIP_SCREENSHOTS,TITANARUM_SKIP_IMAGES,TITANARUM_DPI,TITANARUM_PAGES}
      - BLASTBOX_ENGINE_TITANARUM_DEFAULT_PARAMS=${BLASTBOX_ENGINE_TITANARUM_DEFAULT_PARAMS:-TITANARUM_SKIP_QR=0}
      - BLASTBOX_ENGINE_TITANARUM_RESERVED_KEYS=${BLASTBOX_ENGINE_TITANARUM_RESERVED_KEYS:-TITANARUM_AI_URL,TITANARUM_AI_KEY,TITANARUM_AI_MODEL,TITANARUM_JAVA_BIN,TITANARUM_JAVA_OPTS,TITANARUM_WORKER_JAR,TITANARUM_AOT_CACHE,TITANARUM_JAVA_LIBRARY_PATH,TITANARUM_ZXING_BIN,TITANARUM_ZXING_FORMATS,TITANARUM_CRAC_CHECKPOINT,TITANARUM_CRAC_SCRATCH}
      - BLASTBOX_ENGINE_TITANARUM_NETPOLICY=${BLASTBOX_ENGINE_TITANARUM_NETPOLICY:-none}
      # --- sidecar primitive ---
      # On a warm-pool MISS, requeue the job for the cold dispatcher instead of
      # cold-falling-back (this socket-less box can't launch a cold worker -> would
      # fail closed "runsc unavailable").
      - BLASTBOX_DISPATCH_WARM_ONLY=1
      # Concurrency MUST match warm_size — the warm dispatch path blocks until the
      # job finishes, so N threads are needed to keep N slots busy (default 1
      # starves the pool).
      - BLASTBOX_DISPATCH_CONCURRENCY=${BLASTBOX_GVISOR_WARM_SIZE:-4}
      - BLASTBOX_MAX_QUEUED_AGE_S=${BLASTBOX_MAX_QUEUED_AGE_S:-0}  # bound stuck target_tier jobs
      - BLASTBOX_POOL_RUNTIME=gvisor
      - BLASTBOX_POOL_WARM_SIZE=${BLASTBOX_GVISOR_WARM_SIZE:-4}
      # Default = warm_size: with BURST_SIZE=0 the pool never grows past warm_size,
      # so a higher ceiling is unreachable. Raise it only alongside burst.
      - BLASTBOX_POOL_CEILING=${BLASTBOX_GVISOR_CEILING:-4}
      # Burst MUST be 0 on this socket-less warm-only sidecar. Burst overflow
      # launches EXTRA *cold* docker workers — which this box cannot do (no docker
      # socket) — so a warm-pool miss simply doesn't claim, leaving overflow queued
      # for the cold dispatcher.
      - BLASTBOX_POOL_BURST_SIZE=0
      # --- gVisor C/R config ---
      - BLASTBOX_GVISOR_RUNSC=/usr/bin/runsc
      - BLASTBOX_GVISOR_ROOT=/var/lib/blastbox/gvisor-root
      - BLASTBOX_GVISOR_ROOTFS=/opt/gvisor-rootfs
      - BLASTBOX_GVISOR_NETWORK=none
      # systrap: gVisor's seccomp+signals platform — NO /dev/kvm. This is what
      # makes the tier KVM-less (the whole point). Do NOT switch to the kvm
      # platform here, or the sidecar silently regains a /dev/kvm dependency and
      # fails on KVM-less hosts.
      - BLASTBOX_GVISOR_PLATFORM=systrap
      # The warm worker is the venv python running the blastbox gVisor warm agent
      # (run_warm.py), invoked by its LITERAL venv path so blastbox + titanarum
      # import cleanly (see deploy/gvisor/Dockerfile.titanarum's python3-wrapper
      # comment for why a bare "python3" would fail). NO LD_PRELOAD (file-IPC, no
      # socket accept to retry across restore).
      - BLASTBOX_GVISOR_WARM_ARGV=["/opt/titanarum/bin/python3","/opt/blastbox/run_warm.py"]
      # docker export drops image ENV, so this is the ONLY channel that actually
      # delivers env into the restored container's OCI process env (blastbox
      # builds process.env from scratch — see gvisor_snapshot._oci_config).
      # TITANARUM_WARM/TITANARUM_AOT_CACHE already match engine.py's own defaults
      # and BLASTBOX_WARM_IDLE_TIMEOUT_S matches run_warm.py's own default, so this
      # is belt-and-suspenders explicitness (operator-tunable via .env), not
      # strictly load-bearing.
      - BLASTBOX_GVISOR_EXTRA_ENV=["TITANARUM_WARM=1","TITANARUM_AOT_CACHE=/app/titanarum.aot","BLASTBOX_WARM_IDLE_TIMEOUT_S=86400"]
    volumes:
      # job_root (host-consistent, same path as the cold dispatcher) — read the
      # staged input.
      - "${TITANARUM_DATA_DIR:-/home/coz/titanarum-bb-data}/jobs:${TITANARUM_DATA_DIR:-/home/coz/titanarum-bb-data}/jobs"
      # runsc binary from the host.
      - "/usr/bin/runsc:/usr/bin/runsc:ro"
      # the gVisor warm OCI rootfs (docker export of titanarum-warm:gvisor).
      # NON-nested path (not under the state mount) so runsc's gofer sees it
      # populated. Operator-configurable.
      - "${TITANARUM_GVISOR_DIR:-/home/coz/titanarum-bb-gvisor}/rootfs:/opt/gvisor-rootfs:ro"
      # writable state: runsc --root + the warm-base checkpoint/snapshot + per-slot
      # dirs.
      - "${TITANARUM_GVISOR_DIR:-/home/coz/titanarum-bb-gvisor}/state:/var/lib/blastbox"
    tmpfs:
      # Dispatcher-local scratch (snapshot manager temp + the warm worker's /tmp
      # inside the sandbox is a separate tmpfs from the OCI spec). Titanarum's JVM
      # can spill AOT/class-load + PDFBox scratch, so give ample room.
      - /tmp:rw,exec,nosuid,size=4g
    networks:
      - backend
