name: pdf-titan-arum

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: titanarum
      POSTGRES_USER: titanarum
      POSTGRES_PASSWORD: titanarum
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titanarum"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db/titanarum
      DB_USER: titanarum
      DB_PASSWORD: titanarum
      # PORT: 7272        # override listen port
      # WORKERS: 4        # override worker thread count
      # TIMEOUT: 60       # per-job timeout in seconds
      # OCR_LANG: eng     # tesseract language(s), e.g. eng+deu+fra
      # Fleet-wide default for borderless ("stream") table extraction. `environment:` here is an
      # explicit map, so exporting this in your shell does NOT reach the container -- set it here.
      # Accepts 0/false/no/off to turn it off for every job (REST and the web UI); an explicit
      # per-job value still wins.
      # TITANARUM_STREAM_TABLES_DEFAULT: "false"
      # --- AI analysis (optional) ---
      # AI analysis is OFF unless OPENAI_BASE_URL is set: ServerCommand branches on it being
      # non-blank, and a set-but-unreachable endpoint makes startup block on detectModel and then
      # fail an AI call per job. Leave commented unless you actually have an endpoint.
      # Local model (llama.cpp / vLLM / Ollama-compatible):
      # OPENAI_BASE_URL: http://host.docker.internal:8001/v1
      # OPENAI_API_KEY: none
      # OpenAI:
      # OPENAI_BASE_URL: https://api.openai.com/v1
      # OPENAI_API_KEY: sk-...
      # OPENAI_MODEL: ""   # auto-detected from /v1/models if blank
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7272:7272"
    volumes:
      - artifacts:/data/artifacts

volumes:
  pgdata:
  artifacts:
